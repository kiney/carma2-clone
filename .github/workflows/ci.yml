name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.23.4
          package-manager-cache: false

      - name: Confirm original installation is absent
        run: |
          if [ -e carma2_orig ]; then
            echo "::error::CI must not contain the ignored original game installation."
            exit 1
          fi

      - name: Install locked dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run asset-free tests
        run: npm test
